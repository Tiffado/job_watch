<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Job Watch</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#12213b" />
<link rel="apple-touch-icon" href="icon.png" />
<style>
  :root {
    --navy: #12213b;
    --navy-light: #1f3864;
    --paper: #f6f4ef;
    --amber: #d98e39;
    --amber-dark: #b4711f;
    --red: #b3432f;
    --green: #3f7a5e;
    --blue: #3a6ea5;
    --blue-dark: #2c5580;
    --ink: #1c1c1c;
    --line: #e3ddd0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    background: var(--navy);
    color: var(--paper);
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  header .sub {
    margin-top: 2px;
    font-size: 13px;
    color: #b9c3d6;
  }
  nav.tabs {
    display: flex;
    gap: 4px;
    margin-top: 14px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 3px;
  }
  nav.tabs button {
    flex: 1;
    border: none;
    background: transparent;
    color: #c7cfdd;
    padding: 8px 4px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  nav.tabs button.active {
    background: var(--paper);
    color: var(--navy);
  }
  main {
    padding: 14px 14px 100px;
    max-width: 640px;
    margin: 0 auto;
  }
  .empty {
    text-align: center;
    color: #8a8474;
    padding: 60px 20px;
    font-size: 15px;
    line-height: 1.5;
  }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .card .company {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--amber-dark);
  }
  .card h2 {
    font-size: 16px;
    margin: 4px 0 2px;
    line-height: 1.3;
  }
  .card .meta {
    font-size: 12px;
    color: #8a8474;
    margin-bottom: 10px;
  }
  .card a.open-link {
    display: inline-block;
    font-size: 13px;
    color: var(--navy-light);
    text-decoration: none;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--navy-light);
  }
  .actions {
    display: flex;
    gap: 8px;
  }
  .actions button {
    flex: 1;
    border: none;
    border-radius: 9px;
    padding: 11px 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  button.save-btn { background: var(--green); color: #fff; }
  button.apply-btn { background: var(--blue); color: #fff; }
  button.delete-btn { background: #f1ece1; color: var(--red); }
  button.unsave-btn { background: #f1ece1; color: var(--navy); }
  .actions { flex-wrap: wrap; }
  .actions button { flex: 1 1 28%; min-width: 96px; }
  .analyze-row { margin-bottom: 10px; }
  button.analyze-btn {
    background: none;
    border: 1px solid var(--navy-light);
    color: var(--navy-light);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  button.analyze-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .analysis-result {
    background: #fbf8f0;
    border: 1px solid #e9dfc4;
    border-radius: 9px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 13.5px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .analysis-result.error {
    background: #faeceb;
    border-color: #e3c3bf;
    color: var(--red);
  }
  .saving-tag {
    font-size: 11px;
    color: #8a8474;
    margin-top: 4px;
  }
  .card.expired {
    opacity: 0.6;
    background: #f1efe9;
  }
  .card.expired .company { color: #9a9483; }
  .card.applied {
    background: #eef3f8;
    border-color: #cddce9;
  }
  .badge-expired {
    display: inline-block;
    background: #ddd6c4;
    color: #6b6552;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 2px 7px;
    border-radius: 5px;
    margin-left: 6px;
  }
  .badge-applied {
    display: inline-block;
    background: var(--blue);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 2px 7px;
    border-radius: 5px;
    margin-left: 6px;
  }
  .status-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px);
    font-size: 12px;
    color: #8a8474;
    text-align: center;
    background: linear-gradient(to top, var(--paper) 60%, transparent);
  }
  #settings-panel {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  #settings-panel h2 { font-size: 15px; margin: 0 0 10px; }
  #settings-panel label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #55503f;
    margin-top: 10px;
  }
  #settings-panel input,
  #settings-panel textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    margin-top: 4px;
    box-sizing: border-box;
  }
  #settings-panel button {
    margin-top: 14px;
    width: 100%;
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 11px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  #settings-panel .hint {
    font-size: 11px;
    color: #8a8474;
    margin-top: 8px;
    line-height: 1.5;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 70px;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  .gear {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 18px);
    right: 18px;
    background: none;
    border: none;
    color: #b9c3d6;
    font-size: 20px;
    cursor: pointer;
  }
  .refresh {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 18px);
    right: 54px;
    background: none;
    border: none;
    color: #b9c3d6;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.4s ease;
  }
  .refresh.spinning {
    transform: rotate(360deg);
  }
</style>
</head>
<body>

<header>
  <button class="gear" id="gear-btn" title="Réglages">⚙</button>
  <button class="refresh" id="refresh-btn" title="Rafraîchir">⟳</button>
  <h1>Job Watch</h1>
  <div class="sub" id="sub-status">Chargement…</div>
  <nav class="tabs">
    <button id="tab-new" class="active">À trier</button>
    <button id="tab-saved">Sauvegardées</button>
    <button id="tab-applied">Postulé</button>
  </nav>
</header>

<main id="main"></main>

<div class="status-bar" id="status-bar"></div>
<div class="toast" id="toast"></div>

<script>
const LS_KEY = "jobwatch_config";
let config = JSON.parse(localStorage.getItem(LS_KEY) || "null");
let feed = [];
let currentTab = "new";
const analysisCache = {}; // { [jobId]: { status: "loading"|"done"|"error", text: "" } }

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

function needsSetup() {
  return !config || !config.owner || !config.repo || !config.token;
}

function renderSettings() {
  const main = document.getElementById("main");
  main.innerHTML = `
    <div id="settings-panel">
      <h2>Connexion à ton repo GitHub</h2>
      <label>Propriétaire (ton pseudo GitHub)</label>
      <input id="cfg-owner" placeholder="ex: lionelb59" value="${config?.owner || "Tiffado"}" />
      <label>Nom du repo</label>
      <input id="cfg-repo" placeholder="ex: Job_Watch" value="${config?.repo || "job_watch"}" />
      <label>Branche</label>
      <input id="cfg-branch" placeholder="main" value="${config?.branch || "main"}" />
      <label>Personal Access Token (fine-grained, Contents: Read & write)</label>
      <input id="cfg-token" type="password" placeholder="github_pat_..." value="${config?.token || ""}" />
      <div class="hint">
        Le token reste uniquement sur ton téléphone (stocké localement dans le
        navigateur), il n'est jamais envoyé ailleurs qu'à GitHub. Crée-le sur
        github.com → Settings → Developer settings → Fine-grained tokens,
        limité à ce seul repo, permission "Contents: Read and write".
      </div>
    </div>
    <div id="settings-panel">
      <h2>Analyse des offres (Claude)</h2>
      <label>Clé API Anthropic</label>
      <input id="cfg-claude-key" type="password" placeholder="sk-ant-..." value="${config?.claudeApiKey || ""}" />
      <label>Ton profil / CV (collé en texte)</label>
      <textarea id="cfg-cv" rows="6" placeholder="Colle ici ton profil ou ton CV en texte...">${config?.cvText ? escapeHtml(config.cvText) : ""}</textarea>
      <button id="cfg-save">Enregistrer</button>
      <div class="hint">
        Ta clé API et ton CV restent uniquement sur ton téléphone, jamais
        envoyés ailleurs qu'à l'API Claude au moment de chaque analyse.
        Crée une clé sur console.anthropic.com → API Keys (compte séparé de
        ton abonnement Claude Pro, facturé à l'usage).
      </div>
    </div>
  `;
  document.getElementById("cfg-save").onclick = () => {
    config = {
      owner: document.getElementById("cfg-owner").value.trim(),
      repo: document.getElementById("cfg-repo").value.trim(),
      branch: document.getElementById("cfg-branch").value.trim() || "main",
      token: document.getElementById("cfg-token").value.trim(),
      claudeApiKey: document.getElementById("cfg-claude-key").value.trim(),
      cvText: document.getElementById("cfg-cv").value,
    };
    localStorage.setItem(LS_KEY, JSON.stringify(config));
    toast("Réglages enregistrés");
    loadFeed();
  };
}

async function githubGetFile() {
  const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/jobs_feed.json?ref=${config.branch}`;
  const res = await fetch(url, {
    headers: {
      Authorization: `Bearer ${config.token}`,
      Accept: "application/vnd.github+json",
    },
  });
  if (!res.ok) throw new Error(`GitHub GET ${res.status}`);
  const data = await res.json();
  const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ""))));
  return { json: JSON.parse(content), sha: data.sha };
}

async function githubPutFile(newFeed, sha, message) {
  const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/jobs_feed.json`;
  const body = {
    message,
    branch: config.branch,
    sha,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(newFeed, null, 2)))),
  };
  const res = await fetch(url, {
    method: "PUT",
    headers: {
      Authorization: `Bearer ${config.token}`,
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json",
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`GitHub PUT ${res.status}`);
  return res.json();
}

let currentSha = null;

async function loadFeed() {
  if (needsSetup()) {
    renderSettings();
    document.getElementById("sub-status").textContent = "Configuration requise";
    return;
  }
  document.getElementById("sub-status").textContent = "Chargement…";
  try {
    const { json, sha } = await githubGetFile();
    feed = json;
    currentSha = sha;
    // Restaure les analyses déjà sauvegardées, repliées par défaut
    feed.forEach(j => {
      if (j.analysis) {
        analysisCache[j.id] = { status: "done", text: j.analysis, expanded: false };
      }
    });
    document.getElementById("sub-status").textContent =
      `${feed.filter(j => j.status === "new" || j.status === "expired").length} à trier · ${feed.filter(j => j.status === "saved").length} sauvegardée(s) · ${feed.filter(j => j.status === "applied").length} postulée(s)`;
    render();
  } catch (e) {
    document.getElementById("sub-status").textContent = "Erreur de chargement";
    document.getElementById("main").innerHTML = `<div class="empty">Impossible de charger jobs_feed.json.<br>Vérifie tes réglages (⚙) et que le fichier existe bien dans le repo.<br><br>${e.message}</div>`;
  }
}

async function persistFeed(commitMessage) {
  const result = await githubPutFile(feed, currentSha, commitMessage);
  currentSha = result.content.sha;
}

async function setStatus(id, newStatus) {
  const entry = feed.find(j => j.id === id);
  if (!entry) return;
  const prevStatus = entry.status;
  entry.status = newStatus;
  render(); // optimistic UI update
  try {
    await persistFeed(`Update ${entry.title} -> ${newStatus}`);
    toast(newStatus === "saved" ? "Sauvegardée" : newStatus === "deleted" ? "Supprimée" : "Remise à trier");
  } catch (e) {
    entry.status = prevStatus; // rollback
    render();
    toast("Échec de la sauvegarde, réessaie");
  }
}

async function saveAnalysisToFeed(jobId, text) {
  const entry = feed.find(j => j.id === jobId);
  if (!entry) return;
  entry.analysis = text;
  try {
    await persistFeed(`Add analysis for ${entry.title}`);
  } catch (e) {
    toast("Analyse affichée mais pas sauvegardée (erreur GitHub)");
  }
}

function render() {
  const main = document.getElementById("main");
  let list;
  if (currentTab === "new") {
    list = feed.filter(j => j.status === "new" || j.status === "expired");
  } else {
    list = feed.filter(j => j.status === currentTab);
  }

  if (list.length === 0) {
    const emptyMsg = {
      new: "Rien à trier pour l'instant.<br>Reviens quand le script quotidien aura trouvé du nouveau.",
      saved: "Aucune offre sauvegardée.",
      applied: "Aucune candidature en cours.",
    };
    main.innerHTML = `<div class="empty">${emptyMsg[currentTab]}</div>`;
    return;
  }

  list.sort((a, b) => (b.first_seen || "").localeCompare(a.first_seen || ""));

  main.innerHTML = list.map(job => {
    const isExpired = job.status === "expired";
    const isApplied = job.status === "applied";

    let actionsHtml;
    if (currentTab === "new") {
      actionsHtml = `
        <button class="apply-btn" data-id="${escapeAttr(job.id)}" data-action="applied">📨 Postulé</button>
        <button class="save-btn" data-id="${escapeAttr(job.id)}" data-action="saved">✓ Sauvegarder</button>
        <button class="delete-btn" data-id="${escapeAttr(job.id)}" data-action="deleted">✕ Supprimer</button>
      `;
    } else if (currentTab === "saved") {
      actionsHtml = `
        <button class="apply-btn" data-id="${escapeAttr(job.id)}" data-action="applied">📨 Postulé</button>
        <button class="unsave-btn" data-id="${escapeAttr(job.id)}" data-action="new">↺ À trier</button>
        <button class="delete-btn" data-id="${escapeAttr(job.id)}" data-action="deleted">✕ Supprimer</button>
      `;
    } else {
      actionsHtml = `
        <button class="unsave-btn" data-id="${escapeAttr(job.id)}" data-action="new">↺ Remettre à trier</button>
        <button class="delete-btn" data-id="${escapeAttr(job.id)}" data-action="deleted">✕ Supprimer</button>
      `;
    }

    return `
    <div class="card ${isExpired ? "expired" : ""} ${isApplied ? "applied" : ""}">
      <div class="company">${escapeHtml(job.company)}${isExpired ? '<span class="badge-expired">Expirée</span>' : ""}${isApplied ? '<span class="badge-applied">Postulé</span>' : ""}</div>
      <h2>${escapeHtml(job.title)}</h2>
      <div class="meta">Vu le ${job.first_seen || "?"}${isExpired ? " · n'est plus en ligne" : ""}</div>
      <a class="open-link" href="${job.url}" target="_blank" rel="noopener">Voir l'offre →</a>
      <div class="analyze-row">
        ${renderAnalyzeButton(job)}
        ${renderAnalysisResult(job)}
      </div>
      <div class="actions">${actionsHtml}</div>
    </div>
  `;
  }).join("");

  main.querySelectorAll("button[data-action]").forEach(btn => {
    btn.addEventListener("click", () => setStatus(btn.dataset.id, btn.dataset.action));
  });
  main.querySelectorAll("button[data-analyze]").forEach(btn => {
    btn.addEventListener("click", () => analyzeJob(btn.dataset.analyze));
  });
  main.querySelectorAll("button[data-toggle]").forEach(btn => {
    btn.addEventListener("click", () => toggleAnalysis(btn.dataset.toggle));
  });
}

function renderAnalyzeButton(job) {
  const state = analysisCache[job.id];
  if (!state) {
    return `<button class="analyze-btn" data-analyze="${escapeAttr(job.id)}">🔍 Analyser avec Claude</button>`;
  }
  if (state.status === "loading") {
    return `<button class="analyze-btn" disabled>⏳ Analyse en cours…</button>`;
  }
  if (state.status === "error") {
    return `<button class="analyze-btn" data-analyze="${escapeAttr(job.id)}">🔁 Réessayer l'analyse</button>`;
  }
  const expanded = state.expanded !== false;
  return `<button class="analyze-btn" data-toggle="${escapeAttr(job.id)}">${expanded ? "▲ Masquer l'analyse" : "▼ Voir l'analyse"}</button>`;
}

function renderAnalysisResult(job) {
  const state = analysisCache[job.id];
  if (!state || state.status === "loading") return "";
  if (state.status === "done" && state.expanded === false) return "";
  const cls = state.status === "error" ? "analysis-result error" : "analysis-result";
  const savingTag = state.saving ? `<div class="saving-tag">💾 Sauvegarde en cours, patiente avant de rafraîchir…</div>` : "";
  return `<div class="${cls}">${escapeHtml(state.text)}</div>${savingTag}`;
}

function toggleAnalysis(jobId) {
  const state = analysisCache[jobId];
  if (!state) return;
  state.expanded = state.expanded === false;
  render();
}

async function analyzeJob(jobId) {
  const job = feed.find(j => j.id === jobId);
  if (!job) return;

  if (!config?.claudeApiKey || !config?.cvText) {
    renderSettings();
    toast("Renseigne ta clé API et ton CV dans les réglages");
    return;
  }

  analysisCache[jobId] = { status: "loading", text: "" };
  render();

  try {
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "x-api-key": config.claudeApiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-beta": "web-fetch-2025-09-10",
        "anthropic-dangerous-direct-browser-access": "true",
        "content-type": "application/json",
      },
      body: JSON.stringify({
        model: "claude-sonnet-5",
        max_tokens: 700,
        messages: [{
          role: "user",
          content:
            `Voici mon profil / CV :\n\n${config.cvText}\n\n---\n\n` +
            `Voici l'URL d'une offre d'emploi : ${job.url}\n\n` +
            `Lis le contenu de cette page (fiche de poste) et donne un avis très concis ` +
            `(5 lignes maximum) sur la correspondance avec mon profil : un niveau de match ` +
            `global (fort / moyen / faible), 2-3 points de correspondance clés, et les écarts ` +
            `principaux s'il y en a. Réponds directement, sans préambule ni formule de politesse.`,
        }],
        tools: [{ type: "web_fetch_20250910", name: "web_fetch", max_uses: 1 }],
      }),
    });

    const data = await resp.json();
    if (!resp.ok) {
      throw new Error(data.error?.message || `Erreur HTTP ${resp.status}`);
    }

    const text = (data.content || [])
      .filter(b => b.type === "text")
      .map(b => b.text)
      .join("\n")
      .trim();

    analysisCache[jobId] = { status: "done", text: text || "Aucune réponse exploitable reçue.", expanded: true, saving: true };
    render();
    try {
      await saveAnalysisToFeed(jobId, analysisCache[jobId].text);
    } finally {
      if (analysisCache[jobId]) {
        analysisCache[jobId].saving = false;
        render();
      }
    }
    return;
  } catch (e) {
    analysisCache[jobId] = { status: "error", text: `Échec de l'analyse : ${e.message}` };
  }
  render();
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g, "&quot;");
}

document.getElementById("tab-new").onclick = () => {
  currentTab = "new";
  setActiveTab();
  render();
};
document.getElementById("tab-saved").onclick = () => {
  currentTab = "saved";
  setActiveTab();
  render();
};
document.getElementById("tab-applied").onclick = () => {
  currentTab = "applied";
  setActiveTab();
  render();
};
function setActiveTab() {
  ["new", "saved", "applied"].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle("active", t === currentTab);
  });
}
document.getElementById("gear-btn").onclick = () => renderSettings();
document.getElementById("refresh-btn").onclick = async (e) => {
  e.currentTarget.classList.add("spinning");
  await loadFeed();
  setTimeout(() => e.currentTarget.classList.remove("spinning"), 400);
};

loadFeed();

if ("serviceWorker" in navigator) {
  // Pas de service worker complexe : on veut toujours les données fraîches.
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
}
