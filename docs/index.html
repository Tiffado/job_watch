<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Job Watch</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#12213b" />
<link rel="apple-touch-icon" href="icon.png" />
<style>
  :root {
    --navy: #12213b;
    --navy-light: #1f3864;
    --paper: #f6f4ef;
    --amber: #d98e39;
    --amber-dark: #b4711f;
    --red: #b3432f;
    --green: #3f7a5e;
    --blue: #3a6ea5;
    --blue-dark: #2c5580;
    --ink: #1c1c1c;
    --line: #e3ddd0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    background: var(--navy);
    color: var(--paper);
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  header .sub {
    margin-top: 2px;
    font-size: 13px;
    color: #b9c3d6;
  }
  nav.tabs {
    display: flex;
    gap: 4px;
    margin-top: 14px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 3px;
  }
  nav.tabs button {
    flex: 1;
    border: none;
    background: transparent;
    color: #c7cfdd;
    padding: 8px 4px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  nav.tabs button.active {
    background: var(--paper);
    color: var(--navy);
  }
  main {
    padding: 14px 14px 100px;
    max-width: 640px;
    margin: 0 auto;
  }
  .empty {
    text-align: center;
    color: #8a8474;
    padding: 60px 20px;
    font-size: 15px;
    line-height: 1.5;
  }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .card .company {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--amber-dark);
  }
  .card h2 {
    font-size: 16px;
    margin: 4px 0 2px;
    line-height: 1.3;
  }
  .card .meta {
    font-size: 12px;
    color: #8a8474;
    margin-bottom: 10px;
  }
  .card a.open-link {
    display: inline-block;
    font-size: 13px;
    color: var(--navy-light);
    text-decoration: none;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--navy-light);
  }
  .actions {
    display: flex;
    gap: 8px;
  }
  .actions button {
    flex: 1;
    border: none;
    border-radius: 9px;
    padding: 11px 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  button.save-btn { background: var(--green); color: #fff; }
  button.apply-btn { background: var(--blue); color: #fff; }
  button.delete-btn { background: #f1ece1; color: var(--red); }
  button.unsave-btn { background: #f1ece1; color: var(--navy); }
  .actions { flex-wrap: wrap; }
  .actions button { flex: 1 1 28%; min-width: 96px; }
  .analyze-row { margin-bottom: 10px; }
  button.analyze-btn {
    background: none;
    border: 1px solid var(--navy-light);
    color: var(--navy-light);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  button.analyze-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .analysis-result {
    background: #fbf8f0;
    border: 1px solid #e9dfc4;
    border-radius: 9px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 13.5px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .analysis-result.error {
    background: #faeceb;
    border-color: #e3c3bf;
    color: var(--red);
  }
  /* Niveau de match : bordure gauche + pastille, lisibles d'un coup d'œil.
     Chaque niveau a aussi un symbole, pour ne pas dépendre de la couleur seule. */
  .card { border-left-width: 6px; }
  .card.match-fort    { border-left-color: #2f7d4f; }
  .card.match-moyen   { border-left-color: #b86a00; }
  .card.match-faible  { border-left-color: #b3432f; }
  .card.match-hors    { border-left-color: #8a8474; }
  .match-pill {
    float: right;
    margin-left: 8px;
    font-size: 12px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    color: #fff;
    white-space: nowrap;
  }
  .match-pill.match-fort    { background: #2f7d4f; }
  .match-pill.match-moyen   { background: #b86a00; }
  .match-pill.match-faible  { background: #b3432f; }
  .match-pill.match-hors    { background: #6b6552; }
  .match-pill.match-pending { background: #fff; color: #8a8474; border: 1px dashed #c9c1ad; }
  .card.expired {
    opacity: 0.6;
    background: #f1efe9;
  }
  .card.expired .company { color: #9a9483; }
  .card.applied {
    background: #eef3f8;
    border-color: #cddce9;
  }
  .badge-expired {
    display: inline-block;
    background: #ddd6c4;
    color: #6b6552;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 2px 7px;
    border-radius: 5px;
    margin-left: 6px;
  }
  .badge-applied {
    display: inline-block;
    background: var(--blue);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 2px 7px;
    border-radius: 5px;
    margin-left: 6px;
  }
  .status-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px);
    font-size: 12px;
    color: #8a8474;
    text-align: center;
    background: linear-gradient(to top, var(--paper) 60%, transparent);
  }
  #settings-panel {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  #settings-panel h2 { font-size: 15px; margin: 0 0 10px; }
  #settings-panel label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #55503f;
    margin-top: 10px;
  }
  #settings-panel input,
  #settings-panel textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    margin-top: 4px;
    box-sizing: border-box;
  }
  #settings-panel button {
    margin-top: 14px;
    width: 100%;
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 11px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  #settings-panel .hint {
    font-size: 11px;
    color: #8a8474;
    margin-top: 8px;
    line-height: 1.5;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 70px;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  .gear {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 18px);
    right: 18px;
    background: none;
    border: none;
    color: #b9c3d6;
    font-size: 20px;
    cursor: pointer;
  }
  .refresh {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 18px);
    right: 54px;
    background: none;
    border: none;
    color: #b9c3d6;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.4s ease;
  }
  .refresh.spinning {
    transform: rotate(360deg);
  }
</style>
</head>
<body>

<header>
  <button class="gear" id="gear-btn" title="Réglages">⚙</button>
  <button class="refresh" id="refresh-btn" title="Rafraîchir">⟳</button>
  <h1>Job Watch</h1>
  <div class="sub" id="sub-status">Chargement…</div>
  <nav class="tabs">
    <button id="tab-new" class="active">À trier</button>
    <button id="tab-saved">Sauvegardées</button>
    <button id="tab-applied">Postulé</button>
  </nav>
</header>

<main id="main"></main>

<div class="status-bar" id="status-bar"></div>
<div class="toast" id="toast"></div>

<script>
const LS_KEY = "jobwatch_config";
let config = JSON.parse(localStorage.getItem(LS_KEY) || "null");
let feed = [];
let currentTab = "new";
const analysisCache = {}; // { [jobId]: { status: "loading"|"done"|"error", text: "" } }

// Les analyses restent sur le téléphone (localStorage) : le dépôt est public,
// elles ne sont jamais écrites dans jobs_feed.json.
const ANALYSES_KEY = "jobwatch_analyses";

function loadStoredAnalyses() {
  try {
    return JSON.parse(localStorage.getItem(ANALYSES_KEY) || "{}");
  } catch (e) {
    return {};
  }
}

function storeAnalysis(jobId, text) {
  const analyses = loadStoredAnalyses();
  analyses[jobId] = text;
  try {
    localStorage.setItem(ANALYSES_KEY, JSON.stringify(analyses));
  } catch (e) {
    toast("Analyse affichée mais pas conservée sur ce téléphone");
  }
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

function needsSetup() {
  return !config || !config.owner || !config.repo || !config.token;
}

function renderSettings() {
  const main = document.getElementById("main");
  main.innerHTML = `
    <div id="settings-panel">
      <h2>Connexion à ton repo GitHub</h2>
      <label>Propriétaire (ton pseudo GitHub)</label>
      <input id="cfg-owner" placeholder="ex: Tiffado" value="${config?.owner || "Tiffado"}" />
      <label>Nom du repo</label>
      <input id="cfg-repo" placeholder="ex: Job_Watch" value="${config?.repo || "job_watch"}" />
      <label>Branche</label>
      <input id="cfg-branch" placeholder="main" value="${config?.branch || "main"}" />
      <label>Dépôt privé des verdicts (offre / profil)</label>
      <input id="cfg-data-repo" placeholder="job_watch_data" value="${config?.dataRepo || "job_watch_data"}" />
      <label>Personal Access Token (fine-grained, Contents: Read & write)</label>
      <input id="cfg-token" type="password" placeholder="github_pat_..." value="${config?.token || ""}" />
      <div class="hint">
        Le token reste uniquement sur ton téléphone (stocké localement dans le
        navigateur), il n'est jamais envoyé ailleurs qu'à GitHub. Crée-le sur
        github.com → Settings → Developer settings → Fine-grained tokens,
        limité au repo des offres et au dépôt privé des verdicts, permission
        "Contents: Read and write".
      </div>
    </div>
    <div id="settings-panel">
      <h2>Analyse manuelle (optionnel)</h2>
      <div class="hint">
        Les verdicts quotidiens arrivent seuls depuis le dépôt privé. Ces
        réglages ne servent qu'au bouton « Analyser avec Claude ».
      </div>
      <label>Clé API Anthropic</label>
      <input id="cfg-claude-key" type="password" placeholder="sk-ant-..." value="${config?.claudeApiKey || ""}" />
      <label>Ton profil / CV (collé en texte)</label>
      <textarea id="cfg-cv" rows="6" placeholder="Colle ici ton profil ou ton CV en texte...">${config?.cvText ? escapeHtml(config.cvText) : ""}</textarea>
      <button id="cfg-save">Enregistrer</button>
      <div class="hint">
        Ta clé API, ton CV et les analyses restent uniquement sur ton
        téléphone : ils ne sont envoyés qu'à l'API Claude au moment de chaque
        analyse, jamais écrits dans le dépôt GitHub (public).
        Crée une clé sur console.anthropic.com → API Keys (compte séparé de
        ton abonnement Claude Pro, facturé à l'usage).
      </div>
    </div>
  `;
  document.getElementById("cfg-save").onclick = () => {
    config = {
      owner: document.getElementById("cfg-owner").value.trim(),
      repo: document.getElementById("cfg-repo").value.trim(),
      branch: document.getElementById("cfg-branch").value.trim() || "main",
      dataRepo: document.getElementById("cfg-data-repo").value.trim() || "job_watch_data",
      token: document.getElementById("cfg-token").value.trim(),
      claudeApiKey: document.getElementById("cfg-claude-key").value.trim(),
      cvText: document.getElementById("cfg-cv").value,
    };
    localStorage.setItem(LS_KEY, JSON.stringify(config));
    toast("Réglages enregistrés");
    loadFeed();
  };
}

// Lit un fichier JSON d'un dépôt via l'API GitHub (par défaut : le feed).
async function githubGetFile(repo = config.repo, path = "jobs_feed.json") {
  const url = `https://api.github.com/repos/${config.owner}/${repo}/contents/${path}?ref=${config.branch}`;
  const res = await fetch(url, {
    cache: "no-store", // toujours la dernière version, jamais celle du cache navigateur
    headers: {
      Authorization: `Bearer ${config.token}`,
      Accept: "application/vnd.github+json",
    },
  });
  if (!res.ok) throw new Error(`GitHub GET ${res.status}`);
  const data = await res.json();
  const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ""))));
  return { json: JSON.parse(content), sha: data.sha };
}

// Verdicts du traitement quotidien, lus dans le dépôt privé (matches.json) :
// { updated, matches: { [offerId]: { level, date, analysis } } }
let batchMatches = {};
let matchesStatus = "none"; // "ok" | "error" | "none"
let matchesUpdated = null;

async function loadMatches() {
  try {
    const { json } = await githubGetFile(config.dataRepo || "job_watch_data", "matches.json");
    batchMatches = json.matches || {};
    matchesUpdated = json.updated || null;
    matchesStatus = "ok";
  } catch (e) {
    matchesStatus = "error"; // dépôt absent ou token sans accès : le feed reste utilisable
    toast("Verdicts inaccessibles : donne à ton token l'accès au dépôt privé");
  }
  applyMatches();
}

// Les verdicts du traitement quotidien priment sur une analyse manuelle.
function applyMatches() {
  Object.entries(batchMatches).forEach(([id, m]) => {
    const expanded = analysisCache[id]?.expanded === true;
    const text = (m.level ? `MATCH : ${m.level}\n` : "") + (m.analysis || "");
    analysisCache[id] = { status: "done", text, expanded, source: "batch", level: m.level || null };
  });
}

async function githubPutFile(newFeed, sha, message) {
  const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/jobs_feed.json`;
  const body = {
    message,
    branch: config.branch,
    sha,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(newFeed, null, 2)))),
  };
  const res = await fetch(url, {
    method: "PUT",
    headers: {
      Authorization: `Bearer ${config.token}`,
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json",
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = new Error(`GitHub PUT ${res.status}`);
    err.status = res.status; // 409 : le fichier a changé depuis sa lecture
    throw err;
  }
  return res.json();
}

let currentSha = null;

async function loadFeed() {
  if (needsSetup()) {
    renderSettings();
    document.getElementById("sub-status").textContent = "Configuration requise";
    return;
  }
  document.getElementById("sub-status").textContent = "Chargement…";
  try {
    const { json, sha } = await githubGetFile();
    useFeed(json, sha);
    render();
    await loadMatches();
    updateSubStatus();
    render();
  } catch (e) {
    document.getElementById("sub-status").textContent = "Erreur de chargement";
    document.getElementById("main").innerHTML = `<div class="empty">Impossible de charger jobs_feed.json.<br>Vérifie tes réglages (⚙) et que le fichier existe bien dans le repo.<br><br>${e.message}</div>`;
  }
}

// Remplace le feed affiché par une version lue sur GitHub.
function useFeed(json, sha) {
  feed = json;
  currentSha = sha;
  // Restaure les analyses conservées sur le téléphone, repliées par défaut
  const analyses = loadStoredAnalyses();
  feed.forEach(j => {
    if (analyses[j.id] && !analysisCache[j.id]) {
      analysisCache[j.id] = { status: "done", text: analyses[j.id], expanded: false };
    }
  });
  updateSubStatus();
}

function updateSubStatus() {
  const verdicts = matchesStatus === "ok" && matchesUpdated ? ` · verdicts du ${matchesUpdated}` : "";
  document.getElementById("sub-status").textContent =
    `${feed.filter(j => j.status === "new" || j.status === "expired").length} à trier · ${feed.filter(j => j.status === "saved").length} sauvegardée(s) · ${feed.filter(j => j.status === "applied").length} postulée(s)${verdicts}`;
}

// Les écritures passent une par une : deux clics rapprochés ne partent plus
// avec la même version (sha) du fichier.
let writeQueue = Promise.resolve();

// Enregistre un changement sur GitHub. `applyChange(feedArray)` applique le
// changement à un tableau d'offres : au feed local d'abord, puis, si le fichier
// a changé sur GitHub entre-temps (script quotidien, autre appareil), à la
// version distante relue, avant un nouvel essai.
function persistChange(applyChange, commitMessage) {
  applyChange(feed);
  const write = async () => {
    // Le feed a pu être remplacé depuis le clic (relecture après un conflit,
    // bouton Rafraîchir) : on réapplique le changement à la version courante.
    applyChange(feed);
    try {
      const result = await githubPutFile(feed, currentSha, commitMessage);
      currentSha = result.content.sha;
    } catch (e) {
      if (e.status !== 409) throw e;
      const { json, sha } = await githubGetFile();
      applyChange(json);
      const result = await githubPutFile(json, sha, commitMessage);
      useFeed(json, result.content.sha);
      render();
    }
  };
  const done = writeQueue.then(write);
  writeQueue = done.catch(() => {}); // une écriture en échec ne bloque pas les suivantes
  return done;
}

async function setStatus(id, newStatus) {
  const entry = feed.find(j => j.id === id);
  if (!entry) return;
  const prevStatus = entry.status;
  const setTo = status => list => {
    const e = list.find(j => j.id === id);
    if (e) e.status = status;
  };
  const write = persistChange(setTo(newStatus), `Update ${entry.title} -> ${newStatus}`);
  render(); // affichage immédiat, sans attendre GitHub
  try {
    await write;
    render(); // le feed a pu être relu pendant l'écriture
    toast(newStatus === "saved" ? "Sauvegardée" : newStatus === "deleted" ? "Supprimée" : newStatus === "applied" ? "Postulé" : "Remise à trier");
  } catch (e) {
    setTo(prevStatus)(feed); // annule l'affichage
    render();
    toast("Échec de la sauvegarde, réessaie");
  }
}


function render() {
  const main = document.getElementById("main");
  let list;
  if (currentTab === "new") {
    list = feed.filter(j => j.status === "new" || j.status === "expired");
  } else {
    list = feed.filter(j => j.status === currentTab);
  }

  if (list.length === 0) {
    const emptyMsg = {
      new: "Rien à trier pour l'instant.<br>Reviens quand le script quotidien aura trouvé du nouveau.",
      saved: "Aucune offre sauvegardée.",
      applied: "Aucune candidature en cours.",
    };
    main.innerHTML = `<div class="empty">${emptyMsg[currentTab]}</div>`;
    return;
  }

  list.sort((a, b) => (b.first_seen || "").localeCompare(a.first_seen || ""));

  main.innerHTML = list.map(job => {
    const isExpired = job.status === "expired";
    const isApplied = job.status === "applied";

    let actionsHtml;
    if (currentTab === "new") {
      actionsHtml = `
        <button class="apply-btn" data-id="${escapeAttr(job.id)}" data-action="applied">📨 Postulé</button>
        <button class="save-btn" data-id="${escapeAttr(job.id)}" data-action="saved">✓ Sauvegarder</button>
        <button class="delete-btn" data-id="${escapeAttr(job.id)}" data-action="deleted">✕ Supprimer</button>
      `;
    } else if (currentTab === "saved") {
      actionsHtml = `
        <button class="apply-btn" data-id="${escapeAttr(job.id)}" data-action="applied">📨 Postulé</button>
        <button class="unsave-btn" data-id="${escapeAttr(job.id)}" data-action="new">↺ À trier</button>
        <button class="delete-btn" data-id="${escapeAttr(job.id)}" data-action="deleted">✕ Supprimer</button>
      `;
    } else {
      actionsHtml = `
        <button class="unsave-btn" data-id="${escapeAttr(job.id)}" data-action="new">↺ Remettre à trier</button>
        <button class="delete-btn" data-id="${escapeAttr(job.id)}" data-action="deleted">✕ Supprimer</button>
      `;
    }

    const match = matchLevel(job);
    return `
    <div class="card ${isExpired ? "expired" : ""} ${isApplied ? "applied" : ""} ${match ? `match-${match.key}` : ""}">
      ${renderMatchPill(job, match)}
      <div class="company">${escapeHtml(job.company)}${isExpired ? '<span class="badge-expired">Expirée</span>' : ""}${isApplied ? '<span class="badge-applied">Postulé</span>' : ""}</div>
      <h2>${escapeHtml(job.title)}</h2>
      <div class="meta">Vu le ${job.first_seen || "?"}${isExpired ? " · n'est plus en ligne" : ""}</div>
      <a class="open-link" href="${job.url}" target="_blank" rel="noopener">Voir l'offre →</a>
      <div class="analyze-row">
        ${renderAnalyzeButton(job)}
        ${renderAnalysisResult(job)}
      </div>
      <div class="actions">${actionsHtml}</div>
    </div>
  `;
  }).join("");

  main.querySelectorAll("button[data-action]").forEach(btn => {
    btn.addEventListener("click", () => setStatus(btn.dataset.id, btn.dataset.action));
  });
  main.querySelectorAll("button[data-analyze]").forEach(btn => {
    btn.addEventListener("click", () => analyzeJob(btn.dataset.analyze));
  });
  main.querySelectorAll("button[data-toggle]").forEach(btn => {
    btn.addEventListener("click", () => toggleAnalysis(btn.dataset.toggle));
  });
}

// Niveau de match lu dans l'analyse : première ligne "MATCH : fort" (format
// demandé au modèle) ou ancien format "Match global : moyen".
const MATCH_LEVELS = {
  "fort":       { key: "fort",   label: "●●● Match fort" },
  "moyen":      { key: "moyen",  label: "●●○ Match moyen" },
  "faible":     { key: "faible", label: "●○○ Match faible" },
  "hors cible": { key: "hors",   label: "✕ Hors cible" },
};

function matchLevel(job) {
  const state = analysisCache[job.id];
  if (!state || state.status !== "done") return null;
  if (state.source === "batch") return state.level ? MATCH_LEVELS[state.level] || null : null;
  const found = state.text.match(/match[^:\n]*:\s*\**\s*(fort|moyen|faible|hors cible)/i);
  return found ? MATCH_LEVELS[found[1].toLowerCase()] : null;
}

// Une pastille est toujours affichée : niveau de match, ou raison de son absence.
function renderMatchPill(job, match) {
  if (match) return `<span class="match-pill match-${match.key}">${match.label}</span>`;
  const state = analysisCache[job.id];
  const pill = text => `<span class="match-pill match-pending">${text}</span>`;
  if (state && state.status === "loading") return pill("⏳ Analyse…");
  if (state && state.status === "error") return pill("⚠ Analyse en échec");
  if (state && state.source === "batch") return pill("? À vérifier");
  if (state && state.status === "done") return pill("? Niveau non lu");
  if (matchesStatus === "error") return pill("🔒 Verdicts inaccessibles");
  return pill("… Verdict au prochain passage");
}

function renderAnalyzeButton(job) {
  const state = analysisCache[job.id];
  if (!state) {
    return `<button class="analyze-btn" data-analyze="${escapeAttr(job.id)}">🔍 Analyser avec Claude</button>`;
  }
  if (state.status === "loading") {
    return `<button class="analyze-btn" disabled>⏳ Analyse en cours…</button>`;
  }
  if (state.status === "error") {
    return `<button class="analyze-btn" data-analyze="${escapeAttr(job.id)}">🔁 Réessayer l'analyse</button>`;
  }
  const expanded = state.expanded !== false;
  return `<button class="analyze-btn" data-toggle="${escapeAttr(job.id)}">${expanded ? "▲ Masquer l'analyse" : "▼ Voir l'analyse"}</button>`;
}

function renderAnalysisResult(job) {
  const state = analysisCache[job.id];
  if (!state || state.status === "loading") return "";
  if (state.status === "done" && state.expanded === false) return "";
  const cls = state.status === "error" ? "analysis-result error" : "analysis-result";
  return `<div class="${cls}">${escapeHtml(state.text)}</div>`;
}

function toggleAnalysis(jobId) {
  const state = analysisCache[jobId];
  if (!state) return;
  state.expanded = state.expanded === false;
  render();
}

async function analyzeJob(jobId) {
  const job = feed.find(j => j.id === jobId);
  if (!job) return;

  if (!config?.claudeApiKey || !config?.cvText) {
    renderSettings();
    toast("Renseigne ta clé API et ton CV dans les réglages");
    return;
  }

  analysisCache[jobId] = { status: "loading", text: "" };
  render();

  try {
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "x-api-key": config.claudeApiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-beta": "web-fetch-2025-09-10",
        "anthropic-dangerous-direct-browser-access": "true",
        "content-type": "application/json",
      },
      body: JSON.stringify({
        model: "claude-sonnet-5",
        // Le modèle réfléchit avant de répondre (thinking adaptatif par défaut) :
        // une marge large évite une réponse coupée. Seuls les tokens utilisés sont facturés.
        max_tokens: 2000,
        messages: [{
          role: "user",
          content:
            `Voici mon profil / CV :\n\n${config.cvText}\n\n---\n\n` +
            `Voici l'URL d'une offre d'emploi : ${job.url}\n\n` +
            `Lis le contenu de cette page (fiche de poste) et donne un avis très concis ` +
            `sur la correspondance avec mon profil.\n` +
            `La première ligne doit être exactement "MATCH : fort", "MATCH : moyen", ` +
            `"MATCH : faible" ou "MATCH : hors cible" (une seule valeur). "hors cible" : ` +
            `stage, alternance, poste junior, ou métier différent du mien.\n` +
            `Puis 4 lignes maximum : 2-3 points de correspondance clés, les écarts principaux, ` +
            `le lieu et le présentiel exigés. Distingue mon expérience en production de ce que ` +
            `je n'ai pratiqué qu'en projet personnel ou en formation. Réponds directement, ` +
            `sans préambule ni formule de politesse.`,
        }],
        tools: [{ type: "web_fetch_20250910", name: "web_fetch", max_uses: 1 }],
      }),
    });

    const data = await resp.json();
    if (!resp.ok) {
      throw new Error(data.error?.message || `Erreur HTTP ${resp.status}`);
    }

    const text = (data.content || [])
      .filter(b => b.type === "text")
      .map(b => b.text)
      .join("\n")
      .trim();

    analysisCache[jobId] = { status: "done", text: text || "Aucune réponse exploitable reçue.", expanded: true };
    storeAnalysis(jobId, analysisCache[jobId].text);
    render();
    return;
  } catch (e) {
    analysisCache[jobId] = { status: "error", text: `Échec de l'analyse : ${e.message}` };
  }
  render();
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g, "&quot;");
}

document.getElementById("tab-new").onclick = () => {
  currentTab = "new";
  setActiveTab();
  render();
};
document.getElementById("tab-saved").onclick = () => {
  currentTab = "saved";
  setActiveTab();
  render();
};
document.getElementById("tab-applied").onclick = () => {
  currentTab = "applied";
  setActiveTab();
  render();
};
function setActiveTab() {
  ["new", "saved", "applied"].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle("active", t === currentTab);
  });
}
document.getElementById("gear-btn").onclick = () => renderSettings();
document.getElementById("refresh-btn").onclick = async (e) => {
  e.currentTarget.classList.add("spinning");
  await loadFeed();
  setTimeout(() => e.currentTarget.classList.remove("spinning"), 400);
};

loadFeed();

if ("serviceWorker" in navigator) {
  // Pas de service worker complexe : on veut toujours les données fraîches.
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
}
