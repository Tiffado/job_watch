name: Job Watch

on:
  schedule:
    - cron: "0 7 * * *"   # ~8h heure de Paris
  workflow_dispatch: {}

permissions:
  contents: write

# Jamais deux runs en même temps (run programmé + run manuel).
concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      # L'appli mobile écrit aussi jobs_feed.json. Si elle a commité pendant le
      # run, le push est refusé : on repart alors de la dernière version du
      # dépôt et on relance la mise à jour, au plus 3 fois.
      - name: Update and push feed
        run: |
          git config user.name "job-watch-bot"
          git config user.email "job-watch-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python job_watch.py --no-notify
            git add jobs_feed.json
            if git diff --quiet --cached; then
              echo "Feed inchangé."
              exit 0
            fi
            git commit --quiet -m "Update jobs feed [skip ci]"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            echo "Push refusé (feed modifié entre-temps), essai $attempt sur 3."
            sleep 10
          done
          echo "Échec du push après 3 essais." >&2
          exit 1

      # Notifie seulement une fois le feed enregistré, pour ne jamais annoncer
      # deux fois les mêmes offres.
      - name: Notify new offers
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python job_watch.py --notify-only
