name: Job Watch

on:
  schedule:
    # Tous les jours à 8h00 heure de Paris (7h00 UTC en hiver, 6h00 UTC en été
    # -- GitHub ne gère pas le changement d'heure, 7h UTC est un bon compromis)
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # permet de lancer le check manuellement depuis GitHub / l'app mobile

permissions:
  contents: write   # nécessaire pour que le workflow puisse committer le snapshot mis à jour

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run job watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python job_watch.py

      - name: Save updated snapshot
        run: |
          git config user.name "job-watch-bot"
          git config user.email "job-watch-bot@users.noreply.github.com"
          git add snapshot.json
          git diff --quiet --cached || git commit -m "Update snapshot [skip ci]"
          git push
