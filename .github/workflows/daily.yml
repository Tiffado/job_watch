name: Job Watch

on:
  schedule:
    - cron: "0 7 * * *"   # ~8h heure de Paris
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Run job watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python job_watch.py

      - name: Save updated feed
        run: |
          git config user.name "job-watch-bot"
          git config user.email "job-watch-bot@users.noreply.github.com"
          git add jobs_feed.json
          git diff --quiet --cached || git commit -m "Update jobs feed [skip ci]"
          git push
